name: alice_manager
description: Alice is an HTTP Inspector tool which helps debugging http requests. It catches and stores http requests and responses, which can be viewed via simple UI.
version: 1.0.7
homepage: https://github.com/DexJoke/alice-manager
repository: https://github.com/DexJoke/alice-manager
topics:
  - dio
  - interceptor
  - getx

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  rxdart: ^0.28.0
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  package_info_plus: ^8.0.0
  share_plus: ^12.0.1
  collection: ^1.18.0
  url_launcher: ^6.3.0
  equatable: ^2.0.5
  get: ^4.6.6
  dio: ^5.4.3+1
  draggable_float_widget: ^0.1.0


dev_dependencies:
  flutter_lints: ^4.0.0